[package]
name = "dictate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
cpal = { version = "0.18.2", features = ["pipewire"] }
ctrlc = { version = "3", features = ["termination"] }
hound = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
transcribe-cpp = "0.3.1"
